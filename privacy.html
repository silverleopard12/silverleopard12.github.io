<body>
<h1>개인정보처리방침</h1>
<p>OAuth 앱 "rclone"은 개발자 본인이 자신의 Google Drive를 자신의 컴퓨터에서
rclone으로 사용하기 위한 개인용 앱입니다.</p>
<ul>
<li>Google Drive 데이터는 사용자의 컴퓨터와 Google 사이에서만 오가며, 개발자나 제3자의 서버로 전송·저장되지 않습니다.</li>
<li>어떤 개인정보도 수집·판매·공유하지 않습니다.</li>
<li>사용자는 Google 계정의 보안 설정(타사 앱 액세스)에서 언제든 권한을 철회할 수 있습니다.</li>
</ul>
</body></html>
